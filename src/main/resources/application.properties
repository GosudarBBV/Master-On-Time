spring.application.name=master.on.time
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8080}
spring.jpa.show-sql=true
spring.liquibase.enabled=true
logging.level.org.springframework.security=DEBUG
logging.level.org.springdoc=DEBUG
logging.level.web=DEBUG
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your_email@example.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
google.client.id=YOUR_CLIENT_ID
google.client.secret=${GOOGLE_SECRET}
google.redirect.uri=http://localhost:8080/api/calendar/connect/google/callback

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
