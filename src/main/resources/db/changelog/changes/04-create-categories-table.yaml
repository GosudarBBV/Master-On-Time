databaseChangeLog:
  - changeSet:
      id: create-categories-table
      author: Bohdan Buhrak
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: specialist_id
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_categories_specialist
            baseTableName: categories
            baseColumnNames: specialist_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
