databaseChangeLog:
  - changeSet:
      id: create-activity-logs-table
      author: Bohdan Buhrak
      changes:
        - createTable:
            tableName: activity_logs
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: timestamp
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: action_type
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: affected_entity_type
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: affected_entity_id
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(1000)
              - column:
                  name: ip_address
                  type: varchar(45)
