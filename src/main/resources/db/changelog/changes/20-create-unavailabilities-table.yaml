databaseChangeLog:
  - changeSet:
      id: create-unavailabilities-table
      author: Bohdan Buhrak
      changes:
        - createTable:
            tableName: unavailabilities
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: start_time
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: specialist_id
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_unavailabilities_specialist
            baseTableName: unavailabilities
            baseColumnNames: specialist_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
