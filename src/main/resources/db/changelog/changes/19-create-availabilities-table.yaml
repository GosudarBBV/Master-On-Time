databaseChangeLog:
  - changeSet:
      id: create-availabilities-table
      author: Bohdan Buhrak
      changes:
        - createTable:
            tableName: availabilities
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: day_of_week
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: time
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: time
                  constraints:
                    nullable: false
              - column:
                  name: specialist_id
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_availabilities_specialist
            baseTableName: availabilities
            baseColumnNames: specialist_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
