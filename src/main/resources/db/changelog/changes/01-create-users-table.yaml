databaseChangeLog:
  - changeSet:
      id: create-users-table
      author: Bohdan Buhrak
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: street
                  type: varchar(255)
              - column:
                  name: city
                  type: varchar(100)
              - column:
                  name: zip
                  type: varchar(20)
              - column:
                  name: country
                  type: varchar(100)
              - column:
                  name: phone_number
                  type: varchar(50)
              - column:
                  name: date_of_birth
                  type: date
              - column:
                  name: gender
                  type: varchar(10)
              - column:
                  name: visible
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: google_calendar_access_token
                  type: varchar(500)
              - column:
                  name: google_calendar_refresh_token
                  type: varchar(500)
              - column:
                  name: calendar_sync_enabled
                  type: boolean
              - column:
                  name: active
                  type: boolean
              - column:
                  name: flagged
                  type: boolean
