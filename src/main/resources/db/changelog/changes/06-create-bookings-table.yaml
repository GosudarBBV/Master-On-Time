databaseChangeLog:
  - changeSet:
      id: create-bookings-table
      author: Bohdan Buhrak
      changes:
        - createTable:
            tableName: bookings
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: client_id
                  type: bigint
              - column:
                  name: specialist_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: service_item_id
                  type: bigint
              - column:
                  name: category_id
                  type: bigint
              - column:
                  name: start_time
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: proposed_start_time
                  type: datetime
              - column:
                  name: proposed_end_time
                  type: datetime
              - column:
                  name: reschedule_message
                  type: varchar(500)
              - column:
                  name: follow_up_sent
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: varchar(255)
        - addForeignKeyConstraint:
            constraintName: fk_bookings_client
            baseTableName: bookings
            baseColumnNames: client_id
            referencedTableName: users
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_bookings_specialist
            baseTableName: bookings
            baseColumnNames: specialist_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_bookings_service_item
            baseTableName: bookings
            baseColumnNames: service_item_id
            referencedTableName: category_items
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_bookings_category
            baseTableName: bookings
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
