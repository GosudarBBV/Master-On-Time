databaseChangeLog:
  - changeSet:
      id: create-category-items-table
      author: Bohdan Buhrak
      changes:
        - createTable:
            tableName: category_items
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: duration_minutes
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_category_items_category
            baseTableName: category_items
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            onDelete: CASCADE
