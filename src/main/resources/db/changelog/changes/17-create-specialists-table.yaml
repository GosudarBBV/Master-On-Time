databaseChangeLog:
  - changeSet:
      id: create-specialists-table
      author: Bohdan Buhrak
      changes:
        - createTable:
            tableName: specialists
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: full_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: contact_email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: phone_number
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: credentials
                  type: varchar(2000)
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: admin_notes
                  type: varchar(1000)
              - column:
                  name: registration_date
                  type: datetime
                  constraints:
                    nullable: false
